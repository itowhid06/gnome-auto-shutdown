name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'import json; print(json.load(open("src/metadata.json"))["version-name"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version-name ${version} in src/metadata.json" >&2
            exit 1
          fi

      - name: Build .deb and extension zip
        run: make deb

      - name: Inspect package
        run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
